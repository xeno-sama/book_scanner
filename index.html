<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/book_scanner/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <!--
    Keep Flutter's logical pixels aligned with the physical mobile viewport.
    Without this tag mobile browsers lay the app out as a wide desktop page
    and then zoom/pan the hidden text-editing element when a field is focused.
  -->
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Библиотекарь">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Библиотекарь</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script>
    // Browser OCR via Tesseract.js. Response shape matches native Vision/ML Kit
    // so MarcDraftParser can treat web lines the same way.
    var tesseractLoadPromise = null;

    function ensureTesseract() {
      if (scannerGlobal.Tesseract) {
        return Promise.resolve(scannerGlobal.Tesseract);
      }
      if (tesseractLoadPromise) return tesseractLoadPromise;

      tesseractLoadPromise = new Promise(function (resolve, reject) {
        var script = document.createElement('script');
        script.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
        script.async = true;
        script.onload = function () {
          if (scannerGlobal.Tesseract) {
            resolve(scannerGlobal.Tesseract);
          } else {
            tesseractLoadPromise = null;
            reject(new Error('Tesseract.js не загрузился'));
          }
        };
        script.onerror = function () {
          tesseractLoadPromise = null;
          reject(new Error('Не удалось загрузить Tesseract.js'));
        };
        document.head.appendChild(script);
      });
      return tesseractLoadPromise;
    }

    window.appLibrarianOcr = async function (base64Image) {
      await ensureTesseract();

      const imageDataUrl = 'data:image/jpeg;base64,' + base64Image;
      const image = await new Promise(function (resolve, reject) {
        const element = new Image();
        element.onload = function () { resolve(element); };
        element.onerror = reject;
        element.src = imageDataUrl;
      });
      const imageWidth = image.naturalWidth || image.width;
      const imageHeight = image.naturalHeight || image.height;

      const worker = await window.Tesseract.createWorker('rus+eng', 1, {
        logger: function () {}
      });

      try {
        // Full card — titles, authors, imprint.
        const fullResult = await worker.recognize(image, {
          // Assume a single block of text (catalog card).
          tessedit_pageseg_mode: '6',
        });
        const fullData = fullResult.data || {};

        // Top-left shelf mark only (not the full-height left strip — that pulls
        // half-cut body text and confuses Tesseract badly on web).
        const leftWidth = Math.max(1, Math.round(imageWidth * 0.40));
        const topHeight = Math.max(1, Math.round(imageHeight * 0.42));
        const scale = 2; // upscale small digits for Tesseract
        const leftCanvas = document.createElement('canvas');
        leftCanvas.width = leftWidth * scale;
        leftCanvas.height = topHeight * scale;
        const leftContext = leftCanvas.getContext('2d');
        if (!leftContext) {
          throw new Error('Не удалось подготовить область шифра');
        }
        leftContext.imageSmoothingEnabled = true;
        leftContext.drawImage(
          image,
          0,
          0,
          leftWidth,
          topHeight,
          0,
          0,
          leftWidth * scale,
          topHeight * scale
        );

        // Shelf-mark pass: digits + letters, sparse layout.
        await worker.setParameters({
          tessedit_pageseg_mode: '6',
          // Keep both scripts; whitelist too tight kills Cyrillic Г/В.
          preserve_interword_spaces: '1',
        });
        const leftResult = await worker.recognize(leftCanvas);
        const leftData = leftResult.data || {};

        function sourceLines(data) {
          if (data.lines && data.lines.length) return data.lines;
          // Fallback: group words by approximate y if lines are missing.
          const words = data.words || [];
          if (!words.length) return [];
          const rows = [];
          words.forEach(function (word) {
            const box = word.bbox || {};
            const midY = (Number(box.y0 || 0) + Number(box.y1 || 0)) / 2;
            let row = rows.find(function (item) {
              return Math.abs(item.midY - midY) < 12;
            });
            if (!row) {
              row = { midY: midY, words: [] };
              rows.push(row);
            }
            row.words.push(word);
          });
          rows.sort(function (a, b) { return a.midY - b.midY; });
          return rows.map(function (row) {
            row.words.sort(function (a, b) {
              return Number((a.bbox || {}).x0 || 0) - Number((b.bbox || {}).x0 || 0);
            });
            const first = row.words[0].bbox || {};
            const last = row.words[row.words.length - 1].bbox || {};
            return {
              text: row.words.map(function (w) { return w.text || ''; }).join(' '),
              confidence: row.words.reduce(function (sum, w) {
                return sum + Number(w.confidence || 0);
              }, 0) / row.words.length,
              bbox: {
                x0: Number(first.x0 || 0),
                y0: Math.min.apply(null, row.words.map(function (w) {
                  return Number((w.bbox || {}).y0 || 0);
                })),
                x1: Number(last.x1 || 0),
                y1: Math.max.apply(null, row.words.map(function (w) {
                  return Number((w.bbox || {}).y1 || 0);
                })),
              },
            };
          });
        }

        function mapLines(data, region, prefix, options) {
          options = options || {};
          const coordScale = options.coordScale || 1;
          const raw = sourceLines(data);
          const mapped = raw.map(function (line, index) {
            const box = line.bbox || {};
            const x0 = Number(box.x0 || 0) / coordScale;
            const y0 = Number(box.y0 || 0) / coordScale;
            const x1 = Number(box.x1 || 0) / coordScale;
            const y1 = Number(box.y1 || 0) / coordScale;
            return {
              id: prefix + index,
              text: (line.text || '').trim(),
              confidence: Number(line.confidence || 0) / 100,
              alternatives: [],
              bounds: {
                left: x0 / imageWidth,
                top: y0 / imageHeight,
                width: Math.max(0, x1 - x0) / imageWidth,
                height: Math.max(0, y1 - y0) / imageHeight,
              },
              region: region,
            };
          }).filter(function (line) {
            return line.text.length > 0;
          });

          return mapped;
        }

        const fullLines = mapLines(fullData, 'full', 'web_full_');
        const callLines = mapLines(leftData, 'call_number', 'web_call_', {
          coordScale: scale,
        });

        return JSON.stringify({
          text: fullData.text || '',
          lines: fullLines.concat(callLines),
          imageWidth: imageWidth,
          imageHeight: imageHeight,
        });
      } finally {
        await worker.terminate();
      }
    };

    // Reverse-side inventory numbers are usually handwritten and surrounded
    // by a large blank area. A separate high-contrast numeric pass performs
    // much better than the printed-text settings used for the card front.
    // Its output remains an advisory list; Flutter never saves it directly.
    window.appLibrarianInventoryOcr = async function (base64Image) {
      await ensureTesseract();

      const imageDataUrl = 'data:image/jpeg;base64,' + base64Image;
      const image = await new Promise(function (resolve, reject) {
        const element = new Image();
        element.onload = function () { resolve(element); };
        element.onerror = reject;
        element.src = imageDataUrl;
      });
      const imageWidth = image.naturalWidth || image.width;
      const imageHeight = image.naturalHeight || image.height;
      const longestSide = Math.max(imageWidth, imageHeight);
      const scale = Math.max(1, Math.min(3, 1800 / Math.max(1, longestSide)));
      const canvas = document.createElement('canvas');
      canvas.width = Math.max(1, Math.round(imageWidth * scale));
      canvas.height = Math.max(1, Math.round(imageHeight * scale));
      const context = canvas.getContext('2d', { willReadFrequently: true });
      if (!context) {
        throw new Error('Не удалось подготовить оборот для OCR');
      }
      context.imageSmoothingEnabled = true;
      context.drawImage(image, 0, 0, canvas.width, canvas.height);

      // Remove the card colour and paper texture while retaining blue/black
      // pen strokes. Multiple thresholds would be slower and tend to produce
      // duplicate hallucinations, so use one deliberately moderate boundary.
      const pixels = context.getImageData(0, 0, canvas.width, canvas.height);
      for (let index = 0; index < pixels.data.length; index += 4) {
        const red = pixels.data[index];
        const green = pixels.data[index + 1];
        const blue = pixels.data[index + 2];
        const luminance = (red * 0.299) + (green * 0.587) + (blue * 0.114);
        const ink = luminance < 185 || blue > red + 18;
        const value = ink ? 0 : 255;
        pixels.data[index] = value;
        pixels.data[index + 1] = value;
        pixels.data[index + 2] = value;
        pixels.data[index + 3] = 255;
      }
      context.putImageData(pixels, 0, 0);

      const worker = await window.Tesseract.createWorker('eng', 1, {
        logger: function () {}
      });
      try {
        await worker.setParameters({
          tessedit_char_whitelist: '0123456789-/№#',
          tessedit_pageseg_mode: '11',
          preserve_interword_spaces: '1',
          user_defined_dpi: '300',
        });
        const sparse = await worker.recognize(canvas);
        await worker.setParameters({ tessedit_pageseg_mode: '6' });
        const block = await worker.recognize(canvas);
        const texts = [
          ((sparse.data || {}).text || '').trim(),
          ((block.data || {}).text || '').trim(),
        ].filter(function (value, index, values) {
          return value.length > 0 && values.indexOf(value) === index;
        });
        return JSON.stringify({
          text: texts.join('\n'),
          lines: [],
          imageWidth: imageWidth,
          imageHeight: imageHeight,
        });
      } finally {
        await worker.terminate();
      }
    };
  </script>
  <script src="document_scanner.js"></script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
